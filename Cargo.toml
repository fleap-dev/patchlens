[package]
name = "patchlens"
version = "0.1.0"
edition = "2021"

[build-dependencies]
cc = "*"

[dependencies]
clap = { version = "4.5.29", features = ["derive"] }
diffy = "0.4.0"
patch = "0.7.0"
regex = "1.11.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
tree-sitter = "0.24.4"
tree-sitter-c = "0.23.2"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "myers"
path = "src/myers.rs"
